<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sécurité Biométrique - TontinePro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .fingerprint-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px #f97316); }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .bg-vibrant {
            background: linear-gradient(135deg, #f97316, #ea580c);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-8">

    <!-- Header -->
    <div class="w-full flex justify-start">
        <button class="p-2 glass rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col items-center text-center space-y-8 animate-in fade-in duration-700">
        <div class="w-24 h-24 bg-vibrant rounded-3xl flex items-center justify-center shadow-2xl shadow-orange-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11V7a4 4 0 00-8 0v4M5 9V7a3 3 0 016 0v2m5 2V7a7 7 0 00-14 0v4M5 11v10a1 1 0 001 1h12a1 1 0 001-1V11M5 11h14" />
            </svg>
        </div>

        <div class="space-y-2">
            <h1 class="text-3xl font-bold tracking-tight">Sécurité Biométrique</h1>
            <p class="text-slate-400 max-w-xs mx-auto">
                Utilisez votre empreinte digitale pour un accès ultra-rapide et sécurisé à vos fonds.
            </p>
        </div>

        <!-- Fingerprint UI -->
        <div class="relative py-12">
            <div class="absolute inset-0 bg-orange-500 opacity-20 blur-3xl rounded-full"></div>
            <button id="scan-btn" class="relative z-10 w-40 h-40 glass rounded-full flex items-center justify-center border-2 border-orange-500/30 fingerprint-pulse transition-all hover:scale-105 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 0012 3c1.72 0 3.347.433 4.774 1.2a10 10 0 014.582 9.123m0 0h.01m-.01 0a10 10 0 01-3.207 7.248M12 11c.012-.013.024-.026.037-.04m-12 0c0-1.745.428-3.39 1.182-4.83a1.996 1.996 0 011.002-.916m.01 0a10.003 10.003 0 0113.626 0m0 0l.012.013a1.998 1.998 0 011.003.916m0 0c.754 1.44 1.182 3.085 1.182 4.83M12 11c0-1.105.895-2 2-2s2 .895 2 2m-4 0c0 1.105-.895 2-2 2s-2-.895-2-2m4 0v4m0-4h4m-4 4h-4m4 0l4 4m-4-4l-4 4" />
                </svg>
            </button>
        </div>

        <p id="status-text" class="text-sm font-medium text-slate-500 uppercase tracking-widest animate-pulse">
            Appuyez pour scanner
        </p>
    </div>

    <!-- Footer Actions -->
    <div class="w-full space-y-4">
        <button onclick="simulateSuccess()" class="w-full py-4 bg-vibrant rounded-2xl font-semibold shadow-lg shadow-orange-500/30 hover:opacity-90 transition-all">
            Activer maintenant
        </button>
        <button class="w-full py-4 glass rounded-2xl font-semibold text-slate-300 hover:bg-white/10 transition-all">
            Plus tard
        </button>
    </div>

    <script>
        function simulateSuccess() {
            const btn = document.getElementById('scan-btn');
            const status = document.getElementById('status-text');
            
            btn.classList.remove('fingerprint-pulse');
            btn.classList.add('bg-green-500', 'border-green-400');
            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-white animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            `;
            
            status.innerText = "Empreinte configurée !";
            status.classList.remove('text-slate-500', 'animate-pulse');
            status.classList.add('text-green-500');

            setTimeout(() => {
                alert("Redirection vers le Dashboard...");
            }, 1000);
        }
    </script>
</body>
</html>
