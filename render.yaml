services:
  - type: web
    name: tontinepro-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: KKIAPAY_PUBLIC_KEY
        sync: false
      - key: KKIAPAY_PRIVATE_KEY
        sync: false
      - key: KKIAPAY_SECRET_KEY
        sync: false
      - key: KKIAPAY_WEBHOOK_SECRET
        sync: false
      - key: KKIAPAY_SANDBOX
        value: "true"
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        value: DEMO_KEY_PLACEHOLDER
      - key: AT_SENDER
        value: TontineBenin
      - key: SEUIL_RETRAIT_ADMIN
        value: "50000"
      - key: SEUIL_SCORE_PADME
        value: "70"
      - key: SEUIL_SCORE_MICRO_CREDIT
        value: "60"
      - key: MAX_TENTATIVES_PIN
        value: "3"
      - key: DUREE_OTP_MINUTES
        value: "10"
